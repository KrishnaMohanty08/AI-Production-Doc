name: 🤖 AI DevDocs Engine

on:
  repository_dispatch:
    types: [generate-docs]
  workflow_dispatch:  # manual trigger for testing

permissions:
  contents: write

jobs:
  generate-docs:
    name: Generate AI Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:


      - name: 📥 Checkout buy-sell-app repository
        uses: actions/checkout@v4
        with:
          repository: KrishnaMohanty08/buy-sell-app
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📁 Copy engine scripts into workspace
        run: |
          # Clone the engine repo to get scripts and prompts
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/KrishnaMohanty08/AI-Production-Doc.git /tmp/engine

          cp -r /tmp/engine/scripts .
          cp -r /tmp/engine/prompts .
          cp -r /tmp/engine/templates .

          # Use existing ai-docs or copy templates
          if [[ ! -d ai-docs ]]; then
            cp -r /tmp/engine/ai-docs .
          fi

          chmod +x scripts/*.sh
      
      - name: 🧠 Generate repository intelligence
        run: |
          chmod +x scripts/generate-context.sh
          ./scripts/generate-context.sh

      - name: 📊 Generate progress.md
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ./scripts/generate-progress.sh
          if [[ ! -f ai-docs/progress.md ]] || [[ ! -s ai-docs/progress.md ]]; then
            echo "❌ ERROR: progress.md generation failed or is empty"
            exit 1
          fi
          echo "✅ progress.md generated successfully"

      - name: ⏳ Wait for rate limit
        run: sleep 30

      - name: 🏛️ Generate architecture.md
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ./scripts/generate-architecture.sh
          if [[ ! -f ai-docs/architecture.md ]] || [[ ! -s ai-docs/architecture.md ]]; then
            echo "❌ ERROR: architecture.md generation failed or is empty"
            exit 1
          fi
          echo "✅ architecture.md generated successfully"

      - name: ⏳ Wait for rate limit
        run: sleep 30

      - name: 🗺️ Generate dfd.md
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_2 }}
        run: |
          ./scripts/generate-dfd.sh
          if [[ ! -f ai-docs/dfd.md ]] || [[ ! -s ai-docs/dfd.md ]]; then
            echo "❌ ERROR: dfd.md generation failed or is empty"
            exit 1
          fi
          echo "✅ dfd.md generated successfully"

      - name: ⏳ Wait for rate limit
        run: sleep 30

      - name: 📋 Generate todos.md
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_2 }}
        run: |
          ./scripts/generate-todos.sh
          if [[ ! -f ai-docs/todos.md ]] || [[ ! -s ai-docs/todos.md ]]; then
            echo "❌ ERROR: todos.md generation failed or is empty"
            exit 1
          fi
          echo "✅ todos.md generated successfully"

      - name: 💾 Commit docs back to buy-sell-app
        run: |
          git config --local user.email "ai-devdocs[bot]@users.noreply.github.com"
          git config --local user.name "AI DevDocs Engine"

          git add ai-docs/ changes.diff commit.txt

          if git diff --staged --quiet; then
            echo " No changes to commit."
          else
            git commit -m "docs(ai): auto-update documentation and context [skip ci]"
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/KrishnaMohanty08/buy-sell-app.git
            echo "✅ Docs and context files pushed to buy-sell-app!"
          fi
      
      - name: 📝 Generate diff and commit info
        run: |
          set -euo pipefail
      
          # Git diff as before
          git diff HEAD~1 HEAD -- ':!ai-docs' > changes.diff 2>/dev/null || true
      
          if [[ ! -s changes.diff ]]; then
            git show --stat HEAD > changes.diff 2>/dev/null || true
          fi
      
          if [[ ! -s changes.diff ]]; then
            echo "=== Full repo file listing ===" > changes.diff
            find . -not -path './.git/*' -not -path './node_modules/*' -type f >> changes.diff
          fi
      
          git log -1 --pretty=format:"%s%n%nAuthor: %an <%ae>%nDate: %ad%nHash: %H" \
            --date=short > commit.txt
      
          # ---------------------------------------------------------------
          # NEW: Extract actual source file contents for deep analysis
          # ---------------------------------------------------------------
          echo "=== CODEBASE SNAPSHOT ===" > codebase.txt
      
          # Backend routes
          echo "--- BACKEND ROUTES ---" >> codebase.txt
          find . -path './node_modules' -prune -o \
                 -path './.git' -prune -o \
                 -name "*.js" -path "*/routes/*" -print | while read f; do
            echo "=== FILE: $f ===" >> codebase.txt
            cat "$f" >> codebase.txt
            echo "" >> codebase.txt
          done
      
          # Controllers
          echo "--- CONTROLLERS ---" >> codebase.txt
          find . -path './node_modules' -prune -o \
                 -path './.git' -prune -o \
                 -name "*.js" -path "*/controllers/*" -print | while read f; do
            echo "=== FILE: $f ===" >> codebase.txt
            cat "$f" >> codebase.txt
            echo "" >> codebase.txt
          done
      
          # Models / Prisma schema
          echo "--- MODELS/SCHEMA ---" >> codebase.txt
          find . -path './node_modules' -prune -o \
                 -name "schema.prisma" -print \
                 -o -name "*.model.js" -print \
                 -o -path "*/models/*" -name "*.js" -print | while read f; do
            echo "=== FILE: $f ===" >> codebase.txt
            cat "$f" >> codebase.txt
            echo "" >> codebase.txt
          done
      
          # Frontend pages
          echo "--- FRONTEND PAGES ---" >> codebase.txt
          find . -path './node_modules' -prune -o \
                 -path './.git' -prune -o \
                 \( -name "*.jsx" -o -name "*.tsx" \) -print | while read f; do
            echo "=== FILE: $f ===" >> codebase.txt
            head -80 "$f" >> codebase.txt  # first 80 lines per file
            echo "" >> codebase.txt
          done
      
          # Package.json for dependencies
          echo "--- DEPENDENCIES ---" >> codebase.txt
          find . -maxdepth 3 -name "package.json" \
                 -not -path '*/node_modules/*' | while read f; do
            echo "=== FILE: $f ===" >> codebase.txt
            cat "$f" >> codebase.txt
            echo "" >> codebase.txt
          done
      
          # Docker compose
          if [[ -f docker-compose.yml ]]; then
            echo "--- DOCKER COMPOSE ---" >> codebase.txt
            cat docker-compose.yml >> codebase.txt
          fi
      
          echo "📊 Diff: $(wc -l < changes.diff) lines"
          echo "📦 Codebase snapshot: $(wc -l < codebase.txt) lines"
          echo "💬 Commit: $(head -1 commit.txt)"
